name: ChatGPTWeb
options:
  bundleIdPrefix: com.masakacj
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  ChatGPTWeb:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - ChatGPTWebView.swift
          - UnifiedScriptStore.swift
          - SafariContainerView.swift
      - path: Resources
    dependencies:
      - target: ChatGPTSafariWebExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masakacj.chatgptweb
        PRODUCT_NAME: ChatGPTWeb
        MARKETING_VERSION: 0.4.25
        CURRENT_PROJECT_VERSION: 49
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ChatGPT Web
        INFOPLIST_KEY_NSMicrophoneUsageDescription: ChatGPT Web 需要访问麦克风用于语音输入和语音对话
        INFOPLIST_KEY_NSCameraUsageDescription: ChatGPT Web 需要访问相机用于拍照上传图片和视频
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: ChatGPT Web 需要访问照片用于从相册上传图片和视频
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: ChatGPT Web 需要保存生成或下载的图片和视频到照片
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme:
      testTargets:
        - ChatGPTWebUITests

  ChatGPTSafariWebExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariWebExtension
        excludes:
          - Info.plist
          - manifest.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masakacj.chatgptweb.webextension
        PRODUCT_NAME: ChatGPTSafariWebExtension
        MARKETING_VERSION: 0.4.25
        CURRENT_PROJECT_VERSION: 49
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SafariWebExtension/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
    postBuildScripts:
      - name: Build Safari Web Extension Resources
        script: |
          set -euo pipefail

          MANIFEST_SOURCE="$SRCROOT/SafariWebExtension/manifest.json"
          SHARED_SOURCE="$SRCROOT/safari/chatgpt-safari.user.js"
          RESOURCE_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          MANIFEST_DEST="$RESOURCE_DIR/manifest.json"
          CONTENT_DEST="$RESOURCE_DIR/content.js"

          test -f "$MANIFEST_SOURCE"
          test -f "$SHARED_SOURCE"
          mkdir -p "$RESOURCE_DIR"

          cp "$MANIFEST_SOURCE" "$MANIFEST_DEST"

          cat > "$CONTENT_DEST" <<'JS'
          window.__CHATGPT_SAFARI_CONTAINER__ = true;
          JS

          cat "$SHARED_SOURCE" >> "$CONTENT_DEST"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/manifest.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/content.js

  ChatGPTWebUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ChatGPTWeb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masakacj.chatgptweb.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ChatGPTWeb
