name: ChatGPTWeb
options:
  bundleIdPrefix: com.masakacj
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  ChatGPTWeb:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masakacj.chatgptweb
        PRODUCT_NAME: ChatGPTWeb
        MARKETING_VERSION: 0.3.6
        CURRENT_PROJECT_VERSION: 9
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ChatGPT Web
        INFOPLIST_KEY_NSMicrophoneUsageDescription: ChatGPT Web 需要访问麦克风用于语音输入和语音对话
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed Unified Userscript
        script: |
          set -euo pipefail
          SOURCE="$SRCROOT/safari/chatgpt-safari.user.js"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/chatgpt-safari.user.js"
          test -f "$SOURCE"
          mkdir -p "$(dirname "$DEST")"
          cp "$SOURCE" "$DEST"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/chatgpt-safari.user.js
    scheme:
      testTargets: []
