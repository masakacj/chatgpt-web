name: ChatGPTWeb
options:
  bundleIdPrefix: com.masakacj
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  ChatGPTWeb:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: safari/chatgpt-safari.user.js
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masakacj.chatgptweb
        PRODUCT_NAME: ChatGPTWeb
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ChatGPT Web
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: []
