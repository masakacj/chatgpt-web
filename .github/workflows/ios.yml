name: iOS Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate remote performance engine
        run: node scripts/validate-remote.mjs

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | head -40

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          rm -rf DerivedData dist
          xcodebuild \
            -project ChatGPTWeb.xcodeproj \
            -scheme ChatGPTWeb \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/ChatGPTWeb.app"
          test -d "$APP"

          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          IPA="ChatGPTWeb-${VERSION}-${BUILD}-unsigned.ipa"

          (
            cd dist
            zip -qry "$IPA" Payload
            rm -rf Payload
            shasum -a 256 "$IPA" > "$IPA.sha256"
          )

          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTWeb-unsigned
          path: |
            dist/*.ipa
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$IPA" "dist/$IPA.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/$IPA" \
              "dist/$IPA.sha256" \
              --title "ChatGPT Web $GITHUB_REF_NAME" \
              --generate-notes
          fi
