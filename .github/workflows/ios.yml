name: Mirror iOS Native UX Source Check
on:
  workflow_dispatch:
  push:
    branches: ['main', 'cleanup/current-072-20261013', 'fix/mirror-send-state-*', 'feature/mirror-ux-074-*', 'feature/mirror-controls-075-*', 'feature/mirror-r43-0711-20261019', 'feature/mirror-r55-0712-20261020']
    paths:
      - 'App/**'
      - 'Resources/**'
      - 'SafariScriptAction/**'
      - 'safari/chatgpt-safari.user.js'
      - 'UITests/**'
      - 'scripts/**'
      - 'package.json'
      - 'project.yml'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
concurrency:
  group: ios-current-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Current embedded web script and source checks
        run: npm run check
      - name: Existing local-draft and fallback policy checks
        run: |
          set -euo pipefail
          swiftc App/SharedTabDraftLedger.swift scripts/shared-tab-policy-tests/main.swift -o "$RUNNER_TEMP/shared-draft-policy"
          "$RUNNER_TEMP/shared-draft-policy"
          swiftc App/SharedResourcePolicy.swift scripts/shared-resource-policy-tests/main.swift -o "$RUNNER_TEMP/shared-resource-policy"
          "$RUNNER_TEMP/shared-resource-policy"
          swiftc App/PCCompanionPolicy.swift scripts/pc-companion-policy-tests/main.swift -o "$RUNNER_TEMP/pc-policy"
          "$RUNNER_TEMP/pc-policy"
          swiftc App/ConversationResilienceStore.swift scripts/native-parity-test/main.swift -o "$RUNNER_TEMP/native-parity"
          "$RUNNER_TEMP/native-parity"
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Native shared-tab simulator regression
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project ChatGPTWeb.xcodeproj -scheme ChatGPTWeb -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/CurrentReleaseSimulator" -resultBundlePath "$RUNNER_TEMP/CurrentReleaseTests.xcresult" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 120 -only-testing:ChatGPTWebUITests/SharedTabUITests CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      # R67: expose bounded, source-bound XCTest diagnostics in the PUBLIC
      # workflow summary so MCPOffice can read failures without a GitHub token.
      # Never rerun a failed build or change the signed/stable channel here.
      - name: Publish short CI failure diagnostics
        if: failure()
        run: |
          set +e
          {
            echo '### CI-R67-XCODE-FAILURE-DIAGNOSTICS'
            echo "Run: $GITHUB_RUN_ID"
            echo "Source SHA: $GITHUB_SHA"
            echo "Workflow: $GITHUB_WORKFLOW"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$RUNNER_TEMP/CurrentReleaseTests.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/CurrentReleaseTests.xcresult" --format json > "$RUNNER_TEMP/r67-test-summary.json" 2>/dev/null
            python3 - "$RUNNER_TEMP/r67-test-summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys,re
          try: obj=json.load(open(sys.argv[1]))
          except Exception: obj={}
          hits=[]
          def scan(value):
              if isinstance(value,dict):
                  for k,v in value.items():
                      if k in ('testFailures','issues','failedTests') and isinstance(v,list):
                          for record in v:
                              if isinstance(record,dict):
                                  values=[str(record.get(field,'')) for field in
                                          ('testName','testIdentifier','message','issueType','testCaseName')]
                                  joined=' '.join(x for x in values if x)
                                  if joined: hits.append(joined)
                      scan(v)
              elif isinstance(value,list):
                  for entry in value: scan(entry)
          scan(obj)
          print('Failed XCTest items:')
          print('~~~text')
          for item in dict.fromkeys(hits):
              print(re.sub(r'[^\\w \\u4e00-\\u9fff:.,()=/+-]',' ',item)[:300])
              if len(hits)>20: break
          if not hits: print('xcresult available; no structured failing tests in summary')
          print('~~~')
          PY
          else
            echo 'No simulator xcresult; inspect failed source/build step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Current iPhone Release compilation (never signs or promotes)
        run: |
          xcodebuild -project ChatGPTWeb.xcodeproj -scheme ChatGPTWeb -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/CurrentReleaseDevice" MARKETING_VERSION=0.7.15 CURRENT_PROJECT_VERSION=17 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA (independent of signing)
        if: github.ref == 'refs/heads/feature/mirror-r55-0712-20261020'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/CurrentReleaseDevice/Build/Products/Release-iphoneos/ChatGPTWeb.app"
          test -d "$APP/PlugIns/ChatGPTScriptAction.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "0.7.15"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "17"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry candidate-unsigned.ipa Payload && rm -rf Payload)
          (cd dist && shasum -a 256 candidate-unsigned.ipa > candidate-unsigned.sha256)
      - name: Preserve unsigned IPA for sign-only retries
        if: github.ref == 'refs/heads/feature/mirror-r55-0712-20261020'
        uses: actions/upload-artifact@v4
        with:
          name: mirror-0712-unsigned
          path: |
            dist/candidate-unsigned.ipa
            dist/candidate-unsigned.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload native simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-074-native-simulator
          path: ${{ runner.temp }}/CurrentReleaseTests.xcresult
          if-no-files-found: ignore

  # R78: signing is independent from the 59 simulator tests. On transient
  # transport failures, use "Re-run failed jobs" without rebuilding unsigned IPA.
  sign-candidate:
    if: github.ref == 'refs/heads/feature/mirror-r55-0712-20261020'
    needs: validate-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore SHA-verified unsigned IPA from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: mirror-0712-unsigned
          path: dist
      - name: Verify unsigned IPA artifact checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check candidate-unsigned.sha256
      - name: Sign R87 0.7.15 candidate only after successful Simulator and device Release
        env:
          GH_RUN_TOKEN: ${{ github.token }}
        run: python3 scripts/sign-candidate-r78.py
      - name: Publish bounded signing failure classification
        if: failure()
        run: |
          if [ -s dist/sign-failure.json ]; then
            python3 -c 'import json; x=json.load(open("dist/sign-failure.json")); print("R78 failure: "+str(x.get("category","UNKNOWN"))+"; Run="+str(x.get("runId",""))+"; SHA="+str(x.get("sourceSha","")))'
          else
            echo "R78 sign stage failed before its classification artifact; inspect download/checksum step."
          fi
      - name: Retain candidate signing receipt and failure reason
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r55-mirror-0712-candidate-evidence
          path: |
            dist/candidate-sign-result.json
            dist/stable-before.json
            dist/stable-after.json
            dist/sign-failure.json
          if-no-files-found: ignore
          retention-days: 14
