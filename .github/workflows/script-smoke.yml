name: Script Runtime Smoke

on:
  push:
    branches:
      - main
    paths:
      - "safari/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/script-smoke.yml"
  pull_request:
    paths:
      - "safari/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/script-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lightweight-script-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check

  validate-and-ui-smoke:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate hot-update scripts
        run: npm run check

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run native-anchor script-panel smoke test
        run: |
          set -euo pipefail

          UDID="$(
            xcrun simctl list devices available -j |
            python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; devices=[d for group in data.values() for d in group if d.get("isAvailable") and str(d.get("name","")).startswith("iPhone")]; print(devices[0]["udid"])'
          )"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          rm -rf ScriptSmokeDerivedData

          xcodebuild \
            -project ChatGPTWeb.xcodeproj \
            -scheme ChatGPTWeb \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath "$PWD/ScriptSmokeDerivedData" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 90 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test
