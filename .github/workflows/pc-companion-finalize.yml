name: Finalize Tested PC Companion
on:
  push:
    branches: [feature/structured-pc-companion-20261011]
    paths: ['.github/workflows/pc-companion-finalize.yml']
permissions:
  contents: write
  actions: read
jobs:
  finalize-proven-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVEN_RUN: '38106494310'
      PROVEN_SHA: d29cf1212de0364322d943d547d21c75484bdfb7
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require successful native compile and real simulator acceptance
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const api=p=>JSON.parse(execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/${p}`],{encoding:'utf8'}));
          let run;
          for(let n=0;n<48;n++){
            run=api(`actions/runs/${process.env.PROVEN_RUN}`);
            if(run.status==='completed')break;
            await new Promise(r=>setTimeout(r,20000));
          }
          if(run.status!=='completed'||run.head_sha!==process.env.PROVEN_SHA)throw Error('Pinned test run not complete');
          const jobs=api(`actions/runs/${process.env.PROVEN_RUN}/jobs`).jobs;
          const job=jobs.find(j=>j.name==='native-compile');
          for(const name of ['Existing script and retired PC guards','Native draft persistence and original state policy','Compile iPhone device app','Real iPhone Simulator client and public TLS checks']){
            if(!job?.steps.some(s=>s.name===name&&s.conclusion==='success'))throw Error('Acceptance missing: '+name);
          }
          console.log('Pinned iPhone simulator, native policy and device compilation all succeeded');
          JS
      - name: Accept documentation-only divergence from tested source
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const paths=execFileSync('git',['diff','--name-only',process.env.PROVEN_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          for(const p of paths)if(!p.endsWith('.md')&&p!=='.github/workflows/pc-companion-finalize.yml')throw Error('Untested source drift: '+p);
          console.log('No untested app/policy/fixture changes');
          JS
      - name: Reproduce identical validated integration
        run: |
          node scripts/prepare-companion-beta.mjs
          node scripts/companion-ui-test-support.mjs
          npm run check
      - name: Commit source proven by pinned run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App/PCCompanionView.swift App/PCCompanionPolicy.swift App/PCCompanionRootView.swift package.json project.yml safari/chatgpt-safari.user.js
          git diff --cached --quiet || git commit -m 'Apply iOS 0.5.0 sources verified by native simulator run 38106494310'
          git push origin HEAD:feature/structured-pc-companion-20261011
          git rev-parse HEAD
