name: Config Recovery Optimizer CI
on:
  push:
    branches: ['feature/config-bootstrap-optimizer-20261031']
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-target-boundaries.mjs && node scripts/check-cm-contract.mjs
      - name: Build unsigned Optimizer and run unit tests
        run: |
          set -euo pipefail
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project ChatGPTWeb.xcodeproj -scheme ChatGPTWebOptimized -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/optimizer" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
