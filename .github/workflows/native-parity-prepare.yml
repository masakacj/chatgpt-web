name: Native iOS Parity Prepare
on:
  push:
    branches: [work/ios-native-parity-20261010]
    paths: [.github/workflows/native-parity-prepare.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate-and-build:
    if: github.ref == 'refs/heads/work/ios-native-parity-20261010'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source integration and current stress acceptance
        run: |
          node scripts/integrate-native-parity.mjs
          node scripts/align-native-stress-harness.mjs
      - name: Validate existing runtime and new isolated resources
        run: |
          npm run check
          node --check Resources/NativeConversationBootstrap.js
          node --check Resources/NativeConversationClient.js
      - name: Native storage and safety policy tests
        run: |
          swiftc App/ConversationResilienceStore.swift scripts/native-parity-test/main.swift -o "$RUNNER_TEMP/native-parity-policy"
          "$RUNNER_TEMP/native-parity-policy"
      - name: Compile real iOS device target
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project ChatGPTWeb.xcodeproj -scheme ChatGPTWeb -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/NativeParityDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION=0.4.44 build
          test -f "$RUNNER_TEMP/NativeParityDerivedData/Build/Products/Release-iphoneos/ChatGPTWeb.app/NativeConversationClient.js"
          test -f "$RUNNER_TEMP/NativeParityDerivedData/Build/Products/Release-iphoneos/ChatGPTWeb.app/NativeConversationBootstrap.js"
      - name: Real WKWebView isolated-world native handshake and history preservation
        timeout-minutes: 15
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; devices=[d for group in data.values() for d in group if d.get("isAvailable") and str(d.get("name","")).startswith("iPhone")]; print(devices[0]["udid"])')"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project ChatGPTWeb.xcodeproj -scheme ChatGPTWeb -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/NativeParityUITest" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 120 -only-testing:ChatGPTWebUITests/ChatGPTWebUITests/testWKWebViewResultOnlyStress CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Commit validated integration to same isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App/ChatGPTWebView.swift App/ConversationResilienceBridge.swift Resources/NativeConversationClient.js safari/chatgpt-safari.user.js package.json project.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Validate iOS 0.4.44 native bridge and preserve historical MCP in real WKWebView'
            git push origin HEAD:work/ios-native-parity-20261010
          fi
          git rev-parse HEAD
