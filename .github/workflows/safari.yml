name: Safari Userscript

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate
        run: npm run check

      - name: Package
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp safari/chatgpt-safari.user.js dist/ChatGPT-Safari-Lite.user.js
          (
            cd dist
            sha256sum ChatGPT-Safari-Lite.user.js > ChatGPT-Safari-Lite.user.js.sha256
            zip -q ChatGPT-Safari-Lite.zip ChatGPT-Safari-Lite.user.js
            sha256sum ChatGPT-Safari-Lite.zip > ChatGPT-Safari-Lite.zip.sha256
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Safari-Lite
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v$VERSION"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" \
              --title "ChatGPT Safari Lite $TAG" \
              --target "$GITHUB_SHA"
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "ChatGPT Safari Lite $TAG" \
              --generate-notes
          fi
