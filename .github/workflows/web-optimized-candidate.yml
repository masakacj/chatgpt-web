name: Web Optimized Signed Candidate
# Strict standalone Result Only remains NO-GO (docs/optimized/RESULT_ONLY_GO_NO_GO_20261013.md).
# Optimizer 0.1.7 navigation and heat fixes, independent reviewed candidate; stable unchanged.
# Signed candidate runs only on a reviewed, explicitly marked R1 commit (or authorized manual dispatch).
on:
  workflow_dispatch:
  push:
    branches: ['feature/web-optimized-010-20261013']
    paths:
      - 'OptimizedApp/**'
      - 'OptimizedTests/**'
      - 'OptimizedUITests/**'
      - 'project.yml'
      - '.github/workflows/web-optimized-candidate.yml'
permissions:
  contents: read
concurrency:
  group: web-optimized-signed-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'masakacj/chatgpt-web' && github.ref == 'refs/heads/feature/web-optimized-010-20261013' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native-r1-candidate]'))
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mirror userscript syntax
        run: node --check safari/chatgpt-safari.user.js
      - name: Mirror userscript architecture
        run: node scripts/validate-userscript.mjs
      - name: Mirror project-label regression
        run: node scripts/test-project-labels.mjs
      - name: Optimized PC-style long chat regression
        run: |
          node --check OptimizedResources/Observation/pc-long-chat-adapter.js
          node --test telemetry-worker/test/pc-long-chat-adapter.test.mjs
      - name: Live Debug Worker policy regression
        run: node --test telemetry-worker/test/live-debug.test.mjs
      - name: Optimized observer syntax
        run: node --check OptimizedResources/Observation/conversation-observer.js
      - name: Optimized target boundary
        run: node scripts/check-target-boundaries.mjs
      - name: Optimized CM contract
        run: node scripts/check-cm-contract.mjs
      - name: Generate project and test optimized target
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project ChatGPTWeb.xcodeproj -scheme ChatGPTWebOptimized -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/OptimizedSimulator" -resultBundlePath "$RUNNER_TEMP/OptimizedTests.xcresult" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Compile and package unsigned candidate
        run: |
          set -euo pipefail
          VERSION=0.1.7
          BUILD=8
          xcodebuild -project ChatGPTWeb.xcodeproj -scheme ChatGPTWebOptimized -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/OptimizedCandidate" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" build
          APP="$RUNNER_TEMP/OptimizedCandidate/Build/Products/Release-iphoneos/ChatGPTWebOptimized.app"
          test -d "$APP"
          test ! -d "$APP/PlugIns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.masakacj.chatgptweb.optimized
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry web-optimized-unsigned.ipa Payload && rm -rf Payload)
      - name: Sign into independent candidate channel only
        env:
          GH_RUN_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --http1.1 --retry 10 --retry-all-errors --retry-delay 3 --max-time 20 -fsS https://ipa.781751.xyz:58443/api/v1/apps/chatgpt-web/latest > dist/mirror-stable-before.json
          curl --fail-with-body --max-time 240 -X POST \
            -H "Authorization: Bearer $GH_RUN_TOKEN" \
            -H "X-GitHub-Repository: $GITHUB_REPOSITORY" \
            -H "X-GitHub-Run-Id: $GITHUB_RUN_ID" \
            -H "X-GitHub-Sha: $GITHUB_SHA" \
            -H 'X-App-Key: chatgpt-web-optimized' \
            -H 'Content-Type: application/octet-stream' \
            --data-binary @dist/web-optimized-unsigned.ipa \
            'https://ipa.781751.xyz:58443/api/v1/sign?channel=candidate' > dist/candidate-sign-result.json
          curl --http1.1 --retry 10 --retry-all-errors --retry-delay 3 --max-time 20 -fsS https://ipa.781751.xyz:58443/api/v1/apps/chatgpt-web/latest > dist/mirror-stable-after.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          before=json.loads(Path('dist/mirror-stable-before.json').read_text())
          after=json.loads(Path('dist/mirror-stable-after.json').read_text())
          result=json.loads(Path('dist/candidate-sign-result.json').read_text())
          assert before==after, 'Mirror stable latest changed during optimized candidate signing'
          assert result['ok'] and result['channel']=='candidate' and result['promoted'] is False
          assert result['source_sha']==os.environ['GITHUB_SHA']
          assert result['bundle_id']=='com.masakacj.chatgptweb.optimized'
          assert result['version']=='0.1.7' and str(result['build'])=='8'
          print(json.dumps({'candidate':result['install_page'],'mirrorStableUnchanged':True}))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\nWeb Optimized signed candidate: '+result['install_page']+'\n\nMirror stable unchanged. Physical-iPhone acceptance remains required before promotion.\n')
          PY
      - name: Verify signed archive and manifest
        run: |
          set -euo pipefail
          MANIFEST=$(python3 -c 'import json;print(json.load(open("dist/candidate-sign-result.json"))["manifest_url"])')
          IPA=$(python3 -c 'import json;print(json.load(open("dist/candidate-sign-result.json"))["ipa_url"])')
          curl --http1.1 --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 120 -fsS "$MANIFEST" > dist/candidate-manifest.plist
          curl --http1.1 --retry 8 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 240 -fsS "$IPA" > dist/candidate-signed.ipa
          python3 - <<'PY'
          import json,plistlib,zipfile,hashlib
          from pathlib import Path
          result=json.loads(Path('dist/candidate-sign-result.json').read_text())
          manifest=plistlib.loads(Path('dist/candidate-manifest.plist').read_bytes())
          assert manifest['items'][0]['assets'][0]['url']==result['ipa_url']
          with zipfile.ZipFile('dist/candidate-signed.ipa') as z:
              assert z.testzip() is None
              names=z.namelist()
              info=plistlib.loads(z.read('Payload/ChatGPTWebOptimized.app/Info.plist'))
              assert info['CFBundleIdentifier']=='com.masakacj.chatgptweb.optimized'
              assert info['CFBundleShortVersionString']=='0.1.7'
              assert str(info['CFBundleVersion'])=='8'
              assert 'Payload/ChatGPTWebOptimized.app/embedded.mobileprovision' in names
              assert 'Payload/ChatGPTWebOptimized.app/_CodeSignature/CodeResources' in names
          digest=hashlib.sha256(Path('dist/candidate-signed.ipa').read_bytes()).hexdigest()
          Path('dist/candidate-verification.json').write_text(json.dumps({'bundleId':info['CFBundleIdentifier'],'version':'0.1.7','build':'8','sha256':digest,'zipCRC':True,'physicalIPhoneAccepted':False,'promoted':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-optimized-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/OptimizedTests.xcresult
            dist/*
          if-no-files-found: ignore
