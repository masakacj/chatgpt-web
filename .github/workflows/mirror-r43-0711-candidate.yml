name: Mirror 0.7.11 R43 Signed Candidate
on:
  # One-shot candidate signing: the source-check workflow must already
  # have passed. Only a dedicated workflow-file commit may trigger this.
  push:
    branches: ['feature/mirror-r43-0711-20261019']
    paths:
      - '.github/workflows/mirror-r43-0711-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mirror-r43-candidate-0711
  cancel-in-progress: false
jobs:
  candidate:
    if: >-
      github.repository == 'masakacj/chatgpt-web' &&
      github.ref == 'refs/heads/feature/mirror-r43-0711-20261019' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.event.head_commit.message == 'ci(ios): R43 sign candidate once after macOS tests'))
    runs-on: macos-latest
    timeout-minutes: 55
    env:
      VERSION: '0.7.11'
      BUILD: '13'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify mirror policies and version
        run: |
          set -euo pipefail
          test "$(grep -c 'MARKETING_VERSION: 0.7.11' project.yml)" -eq 2
          test "$(grep -c 'CURRENT_PROJECT_VERSION: 13' project.yml)" -eq 2
          grep -q 'let blockedByPage =' App/SharedTabModel.swift
          grep -q 'func stopGeneration() async' App/SharedTabModel.swift
          grep -q 'stopTargetId' App/SharedTabModel.swift
          grep -q 'shared.stop' App/SharedTabScreen.swift
          grep -q 'testUnknownStopKeepsReceiptAndNeverRepeatsTheNativeClick' UITests/SharedTabUITests.swift
          grep -q 'func canReserve' App/SharedTabDraftLedger.swift
          grep -q 'sendDisabledReason' App/SharedTabModel.swift
          grep -q 'testUnknownSendMakesReasonVisibleAndAllowsOnlyDifferentNewText' UITests/SharedTabUITests.swift
          grep -q 'testStopAndUncertainSendCanCoexistWithoutPermanentlyGrayFollowUp' UITests/SharedTabUITests.swift
          npm run check
          swiftc App/SharedTabDraftLedger.swift scripts/shared-tab-policy-tests/main.swift -o "$RUNNER_TEMP/draft"
          "$RUNNER_TEMP/draft"
          swiftc App/PCCompanionPolicy.swift scripts/pc-companion-policy-tests/main.swift -o "$RUNNER_TEMP/policy"
          "$RUNNER_TEMP/policy"
          swiftc App/ConversationResilienceStore.swift scripts/native-parity-test/main.swift -o "$RUNNER_TEMP/native"
          "$RUNNER_TEMP/native"
      - name: Verify green macOS Simulator CI on identical application source
        env:
          GH_RUN_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PROVEN_SHA=110478bb2266ac649fd2364b9030ac5376bc1f46
          PROVEN_RUN=39265829946
          git cat-file -e "$PROVEN_SHA^{commit}"
          # Since the complete macOS UI/Release run passed for PROVEN_SHA,
          # only candidate signing workflow changes may differ today.
          git diff --name-only "$PROVEN_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/r43-diff.txt"
          test -s "$RUNNER_TEMP/r43-diff.txt"
          if grep -vFx '.github/workflows/mirror-r43-0711-candidate.yml' "$RUNNER_TEMP/r43-diff.txt"; then
            echo 'APP_SOURCE_CHANGED_NEW_FULL_SIMULATOR_REQUIRED'
            exit 1
          fi
          curl -fsS --max-time 15 -H "Authorization: Bearer $GH_RUN_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PROVEN_RUN"             > "$RUNNER_TEMP/r43-proven-run.json"
          PROVEN_SHA="$PROVEN_SHA" PROVEN_RUN="$PROVEN_RUN" python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(os.environ['RUNNER_TEMP'],'r43-proven-run.json').read_text())
          assert r['id']==int(os.environ['PROVEN_RUN'])
          assert r['head_sha']==os.environ['PROVEN_SHA']
          assert r['repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert r['status']=='completed' and r['conclusion']=='success'
          print('R43_PREVIOUS_MACOS_UI_AND_RELEASE_GREEN_FOR_IDENTICAL_APP')
          PY
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build unsigned mirror IPA
        run: |
          set -euo pipefail
          xcodebuild -project ChatGPTWeb.xcodeproj -scheme ChatGPTWeb -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/PhoneDevice" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP="$RUNNER_TEMP/PhoneDevice/Build/Products/Release-iphoneos/ChatGPTWeb.app"
          test -d "$APP/PlugIns/ChatGPTScriptAction.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.masakacj.chatgptweb
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry candidate-unsigned.ipa Payload && rm -rf Payload)
      - name: Sign mirror candidate without modifying stable latest
        env:
          GH_RUN_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://ipa.78175132.xyz/api/v1/apps/chatgpt-web/latest > dist/stable-before.json
          curl --fail-with-body --max-time 240 -X POST -H "Authorization: Bearer $GH_RUN_TOKEN" -H "X-GitHub-Repository: $GITHUB_REPOSITORY" -H "X-GitHub-Run-Id: $GITHUB_RUN_ID" -H "X-GitHub-Sha: $GITHUB_SHA" -H 'X-App-Key: chatgpt-web' -H 'Content-Type: application/octet-stream' --data-binary @dist/candidate-unsigned.ipa 'https://ipa.78175132.xyz/api/v1/sign?channel=candidate' > dist/candidate-sign-result.json
          curl -fsS --max-time 20 https://ipa.78175132.xyz/api/v1/apps/chatgpt-web/latest > dist/stable-after.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads(Path('dist/stable-before.json').read_text())
          b=json.loads(Path('dist/stable-after.json').read_text())
          c=json.loads(Path('dist/candidate-sign-result.json').read_text())
          assert a==b and a['version']=='0.7.10' and str(a['build'])=='12'
          assert c['ok'] and c['channel']=='candidate' and c['promoted'] is False
          assert c['source_sha']==os.environ['GITHUB_SHA'] and c['bundle_id']=='com.masakacj.chatgptweb'
          assert c['version']==os.environ['VERSION'] and str(c['build'])==os.environ['BUILD']
          print(json.dumps({'candidate':c['install_page'],'stableUnchanged':True}))
          PY
      - name: Verify signatures and install manifest
        run: |
          set -euo pipefail
          MANIFEST="$(python3 -c 'import json;print(json.load(open("dist/candidate-sign-result.json"))["manifest_url"])')"
          IPA="$(python3 -c 'import json;print(json.load(open("dist/candidate-sign-result.json"))["ipa_url"])')"
          curl -fsS --max-time 30 "$MANIFEST" > dist/signed-manifest.plist
          curl -fsS --max-time 90 "$IPA" > dist/signed.ipa
          python3 - <<'PY'
          import os,json,plistlib,zipfile,hashlib
          from pathlib import Path
          meta=json.loads(Path('dist/candidate-sign-result.json').read_text())
          manifest=plistlib.loads(Path('dist/signed-manifest.plist').read_bytes())
          assert manifest['items'][0]['assets'][0]['url']==meta['ipa_url']
          assert meta['ipa_url'].startswith('https://ipa.781751.xyz:58443/ipa/')
          assert meta['manifest_url'].startswith('https://ipa.781751.xyz:58443/manifest/')
          with zipfile.ZipFile('dist/signed.ipa') as z:
              assert z.testzip() is None
              info=plistlib.loads(z.read('Payload/ChatGPTWeb.app/Info.plist'))
              assert info['CFBundleIdentifier']=='com.masakacj.chatgptweb'
              assert info['CFBundleShortVersionString']==os.environ['VERSION']
              assert str(info['CFBundleVersion'])==os.environ['BUILD']
              for name in ('Payload/ChatGPTWeb.app/embedded.mobileprovision','Payload/ChatGPTWeb.app/_CodeSignature/CodeResources','Payload/ChatGPTWeb.app/PlugIns/ChatGPTScriptAction.appex/_CodeSignature/CodeResources','Payload/ChatGPTWeb.app/PlugIns/ChatGPTScriptAction.appex/embedded.mobileprovision'):
                  assert name in z.namelist(), name
          print(json.dumps({'signed':True,'sha256':hashlib.sha256(Path('dist/signed.ipa').read_bytes()).hexdigest()}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirror-r43-0711-signed
          path: |
            dist/signed.ipa
            dist/signed-manifest.plist
            dist/candidate-sign-result.json
            ${{ runner.temp }}/PhoneUI.xcresult
          if-no-files-found: ignore
