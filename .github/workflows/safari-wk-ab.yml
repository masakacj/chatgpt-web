name: Safari vs WKWebView A-B

on:
  push:
    branches:
      - bench/safari-wk-ab
    paths:
      - "App/**"
      - "Benchmarks/AB/**"
      - "UITests/**"
      - "project.yml"
      - ".github/workflows/safari-wk-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari-wk-ab:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Start benchmark server
        run: |
          set -euo pipefail
          mkdir -p Benchmarks/AB/out
          rm -f Benchmarks/AB/out/ab-reports.jsonl
          python3 Benchmarks/AB/server.py             --host 127.0.0.1             --port 8765             --report Benchmarks/AB/out/ab-reports.jsonl             > Benchmarks/AB/out/server.log 2>&1 &
          echo $! > Benchmarks/AB/out/server.pid

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/status >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done

          cat Benchmarks/AB/out/server.log
          exit 1

      - name: Boot iPhone Simulator
        id: simulator
        run: |
          set -euo pipefail

          UDID="$(
            xcrun simctl list devices available -j |
            python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; devices=[d for group in data.values() for d in group if d.get("isAvailable") and str(d.get("name","")).startswith("iPhone")]; print(devices[0]["udid"])'
          )"

          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run Safari vs WKWebView A-B
        env:
          CGPT_AB_BASE_URL: http://127.0.0.1:8765/fixture
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail

          rm -rf ABTestDerivedData

          (
            while true; do
              echo "=== $(date +%s) ==="
              xcrun simctl spawn "$UDID"                 ps -axo pid=,rss=,comm= 2>/dev/null |
                grep -Ei 'ChatGPTWeb|SafariViewService|WebContent' || true
              sleep 0.25
            done
          ) > Benchmarks/AB/out/process-samples.log 2>&1 &
          SAMPLER_PID=$!

          cleanup() {
            kill "$SAMPLER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          xcodebuild             -project ChatGPTWeb.xcodeproj             -scheme ChatGPTWeb             -configuration Debug             -sdk iphonesimulator             -destination "id=$UDID"             -derivedDataPath "$PWD/ABTestDerivedData"             -parallel-testing-enabled NO             -test-timeouts-enabled YES             -default-test-execution-time-allowance 180             -maximum-test-execution-time-allowance 240             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             -only-testing:ChatGPTWebUITests/ChatGPTWebUITests/testSafariWKABBenchmark             test

      - name: Summarize A-B results
        if: always()
        run: |
          set -euo pipefail

          REPORT="Benchmarks/AB/out/ab-reports.jsonl"

          if [[ ! -s "$REPORT" ]]; then
            echo "# Safari vs WKWebView A/B" > Benchmarks/AB/out/ab-summary.md
            echo "" >> Benchmarks/AB/out/ab-summary.md
            echo "No benchmark reports were received." >> Benchmarks/AB/out/ab-summary.md
            cat Benchmarks/AB/out/ab-summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 Benchmarks/AB/summarize.py             "$REPORT"             --json-out Benchmarks/AB/out/ab-summary.json             --md-out Benchmarks/AB/out/ab-summary.md

          cat Benchmarks/AB/out/ab-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload A-B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-wk-ab
          path: |
            Benchmarks/AB/out/ab-reports.jsonl
            Benchmarks/AB/out/ab-summary.json
            Benchmarks/AB/out/ab-summary.md
            Benchmarks/AB/out/process-samples.log
            Benchmarks/AB/out/server.log
          if-no-files-found: warn
