name: Safari vs WKWebView A-B

on:
  push:
    branches:
      - bench/safari-wk-ab
    paths:
      - "App/**"
      - "Benchmarks/AB/**"
      - "UITests/**"
      - "project.yml"
      - ".github/workflows/safari-wk-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari-wk-ab:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Start benchmark server
        run: |
          set -euo pipefail
          mkdir -p Benchmarks/AB/out
          rm -f Benchmarks/AB/out/ab-reports.jsonl

          python3 Benchmarks/AB/server.py \
            --host 0.0.0.0 \
            --port 8765 \
            --report Benchmarks/AB/out/ab-reports.jsonl \
            > Benchmarks/AB/out/server.log 2>&1 &

          echo $! > Benchmarks/AB/out/server.pid

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/status >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done

          cat Benchmarks/AB/out/server.log
          exit 1

      - name: Resolve host address
        id: host
        run: |
          set -euo pipefail

          IFACE="$(
            route -n get default 2>/dev/null |
            awk '/interface:/{print $2; exit}'
          )"

          HOST_IP="$(
            ipconfig getifaddr "$IFACE" 2>/dev/null ||
            true
          )"

          if [[ -z "$HOST_IP" ]]; then
            HOST_IP="$(
              ifconfig |
              awk '/inet / && $2 !~ /^127\./ {print $2; exit}'
            )"
          fi

          test -n "$HOST_IP"

          echo "ip=$HOST_IP" >> "$GITHUB_OUTPUT"
          echo "Benchmark host: $HOST_IP"

          curl -fsS http://127.0.0.1:8765/status

      - name: Resolve Xcode simulator destination
        id: destination
        run: |
          set -euo pipefail

          xcodebuild \
            -project ChatGPTWeb.xcodeproj \
            -scheme ChatGPTWeb \
            -showdestinations \
            > Benchmarks/AB/out/destinations.txt

          DEST_ID="$(
            python3 - <<'PY'
import re
from pathlib import Path

text = Path("Benchmarks/AB/out/destinations.txt").read_text(
    encoding="utf-8",
    errors="replace",
)

matches = re.findall(
    r"\{\s*platform:iOS Simulator,\s*arch:[^,]+,\s*id:([^,}]+),\s*OS:[^,}]+,\s*name:([^}]+)\}",
    text,
)

preferred = [
    item
    for item in matches
    if item[1].strip().startswith("iPhone")
]

if not preferred:
    raise SystemExit("No iPhone Simulator destination found")

print(preferred[0][0].strip())
PY
          )"

          test -n "$DEST_ID"
          echo "id=$DEST_ID" >> "$GITHUB_OUTPUT"
          echo "Using Simulator destination: $DEST_ID"

      - name: Run Safari vs WKWebView A-B
        env:
          CGPT_AB_BASE_URL: http://${{ steps.host.outputs.ip }}:8765/fixture
          DEST_ID: ${{ steps.destination.outputs.id }}
        run: |
          set -euo pipefail

          rm -rf ABTestDerivedData
          echo "CGPT_AB_BASE_URL=$CGPT_AB_BASE_URL"

          (
            while true; do
              echo "=== $(date +%s) ==="
              ps -axo pid=,rss=,command= 2>/dev/null |
                grep -Ei 'ChatGPTWeb|SafariViewService|WebContent|CoreSimulator' || true
              sleep 0.25
            done
          ) > Benchmarks/AB/out/process-samples.log 2>&1 &

          SAMPLER_PID=$!

          cleanup() {
            kill "$SAMPLER_PID" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          xcodebuild \
            -project ChatGPTWeb.xcodeproj \
            -scheme ChatGPTWeb \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$DEST_ID" \
            -derivedDataPath "$PWD/ABTestDerivedData" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -only-testing:ChatGPTWebUITests/ChatGPTWebUITests/testSafariWKABBenchmark \
            test

      - name: Verify report count
        if: always()
        run: |
          set -euo pipefail

          REPORT="Benchmarks/AB/out/ab-reports.jsonl"
          COUNT=0

          if [[ -f "$REPORT" ]]; then
            COUNT="$(grep -cve '^$' "$REPORT" || true)"
          fi

          echo "Received reports: $COUNT / 12"

          if [[ "$COUNT" -ne 12 ]]; then
            exit 1
          fi

      - name: Summarize A-B results
        if: always()
        run: |
          set -euo pipefail

          REPORT="Benchmarks/AB/out/ab-reports.jsonl"

          if [[ ! -s "$REPORT" ]]; then
            echo "# Safari vs WKWebView A/B" > Benchmarks/AB/out/ab-summary.md
            echo "" >> Benchmarks/AB/out/ab-summary.md
            echo "No benchmark reports were received." >> Benchmarks/AB/out/ab-summary.md
            cat Benchmarks/AB/out/ab-summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 Benchmarks/AB/summarize.py \
            "$REPORT" \
            --json-out Benchmarks/AB/out/ab-summary.json \
            --md-out Benchmarks/AB/out/ab-summary.md

          cat Benchmarks/AB/out/ab-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload A-B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-wk-ab
          path: |
            Benchmarks/AB/out/ab-reports.jsonl
            Benchmarks/AB/out/ab-summary.json
            Benchmarks/AB/out/ab-summary.md
            Benchmarks/AB/out/process-samples.log
            Benchmarks/AB/out/server.log
          if-no-files-found: warn
